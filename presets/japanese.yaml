# Japanese Academic Paper Format
# Based on common Japanese university thesis standards
# Suitable for: Japanese academic papers, theses

description: "日本語 - 学術論文/卒業論文格式"

format_rules:
  font:
    chinese: "MS Mincho"  # 日文宋体
    english: "Times New Roman"
    heading_chinese: "MS Gothic"  # 日文黑体
    japanese: "MS Mincho"
    japanese_heading: "MS Gothic"

  headings:
    heading1:
      font_size: 14
      bold: true
      align: "center"
      space_before: 24
      space_after: 12
      line_spacing: 1.5
    heading2:
      font_size: 12
      bold: true
      align: "left"
      space_before: 18
      space_after: 8
      line_spacing: 1.5
    heading3:
      font_size: 10.5
      bold: true
      align: "left"
      space_before: 12
      space_after: 6
      line_spacing: 1.5

  body_text:
    font_size: 10.5
    line_spacing: 1.5
    first_line_indent: 1
    align: "justify"

  margins:
    top: 3.0
    bottom: 3.0
    left: 2.5
    right: 2.5

  abstract:
    title_font_size: 12
    title_bold: true
    title_align: "center"
    font_size: 10.5
    line_spacing: 1.5
    max_lines: 20

auto_detect:
  title:
    patterns: ["title", "題名", "タイトル"]
    confidence: 0.8
  author:
    patterns: ["author", "著者", "著者名"]
    confidence: 0.8
  abstract:
    patterns: ["abstract", "抄録", "要約", "アブストラクト"]
    confidence: 0.9
  keywords:
    patterns: ["keywords", "キーワード", "關鍵語"]
    confidence: 0.9
  body:
    patterns: ["body", "本文"]
    confidence: 0.7
  reference:
    patterns: ["reference", "references", "参考文献", "文献"]
    confidence: 0.9
