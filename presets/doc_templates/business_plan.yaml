# 商业方案模板
# 适用于：商业计划书、项目方案、策划书、提案等

description: "商业方案 - 适用于商业计划书、项目方案、策划书等"

format_rules:
  font:
    chinese: "微软雅黑"
    english: "Arial"
    heading_chinese: "微软雅黑"

  headings:
    heading1:
      font_size: 22
      bold: true
      align: "left"
      space_before: 24
      space_after: 12
    heading2:
      font_size: 16
      bold: true
      align: "left"
      space_before: 18
      space_after: 6
    heading3:
      font_size: 14
      bold: false
      align: "left"
      space_before: 12
      space_after: 6

  body_text:
    font_size: 12
    line_spacing: 1.5
    first_line_indent: 0
    align: "left"

  margins:
    top: 2.54
    bottom: 2.54
    left: 3.17
    right: 3.17

doc_type_hints:
  - "商业计划书"
  - "项目方案"
  - "策划书"
  - "提案"
  - "计划书"
  - "招投标"
  - "标书"
