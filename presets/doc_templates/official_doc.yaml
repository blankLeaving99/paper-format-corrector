# 企业公文模板
# 适用于：通知、通报、函、纪要、决定等

description: "企业公文 - 适用于通知、通报、函等正式公文"

format_rules:
  font:
    chinese: "仿宋"
    english: "Times New Roman"
    heading_chinese: "黑体"

  headings:
    heading1:
      font_size: 22
      bold: true
      align: "center"
      space_before: 12
      space_after: 12
    heading2:
      font_size: 16
      bold: true
      align: "left"
      space_before: 12
      space_after: 6
    heading3:
      font_size: 14
      bold: false
      align: "left"
      space_before: 6
      space_after: 3

  body_text:
    font_size: 14
    line_spacing: 1.5
    first_line_indent: 2
    align: "justify"

  margins:
    top: 3.7
    bottom: 3.5
    left: 2.8
    right: 2.6

doc_type_hints:
  - "通知"
  - "通报"
  - "函"
  - "纪要"
  - "决定"
  - "公告"
  - "公文"
  - "红头文件"
