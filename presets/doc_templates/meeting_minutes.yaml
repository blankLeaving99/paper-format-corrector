# 会议纪要模板
# 适用于：会议纪要、会议记录、工作纪要等

description: "会议纪要 - 适用于会议纪要、会议记录等"

format_rules:
  font:
    chinese: "仿宋"
    english: "Times New Roman"
    heading_chinese: "黑体"

  headings:
    heading1:
      font_size: 16
      bold: true
      align: "center"
      space_before: 12
      space_after: 12
    heading2:
      font_size: 14
      bold: true
      align: "left"
      space_before: 12
      space_after: 6
    heading3:
      font_size: 12
      bold: false
      align: "left"
      space_before: 6
      space_after: 3

  body_text:
    font_size: 14
    line_spacing: 1.5
    first_line_indent: 2
    align: "justify"

  margins:
    top: 3.7
    bottom: 3.5
    left: 2.8
    right: 2.6

doc_type_hints:
  - "会议纪要"
  - "会议记录"
  - "工作纪要"
  - "纪要"
  - "会议纪要"
